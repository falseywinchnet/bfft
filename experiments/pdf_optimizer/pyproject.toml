[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-representation-optimizer"
version = "0.1.0"
description = "Forensic, candidate-competing PDF representation optimizer"
requires-python = ">=3.10"
dependencies = [
  "pikepdf>=10.10,<11",
  "pypdf>=6.0,<7",
  "zopfli>=0.2.3",
]

[project.optional-dependencies]
test = ["pytest>=8", "Pillow>=11"]
study = ["Pillow>=11", "numpy>=2", "scipy>=1.14"]
jbig2 = ["Pillow>=11"]
mrc = ["Pillow>=11", "numpy>=2", "scipy>=1.14"]
qa = ["PyMuPDF>=1.26", "Pillow>=11", "numpy>=2", "scipy>=1.14"]

[project.scripts]
pdf-repr = "pdf_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
