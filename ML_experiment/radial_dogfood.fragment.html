<section id="radial-dogfood-viz" aria-label="Radial self-context dogfood results">
  <style>
    #radial-dogfood-viz{color:var(--foreground);font-family:inherit;max-width:100%;overflow:hidden;position:relative}
    #radial-dogfood-viz h2,#radial-dogfood-viz h3{font-weight:500;margin:0}
    #radial-dogfood-viz h2{margin-bottom:.25rem}
    #radial-dogfood-viz .lede{color:var(--muted-foreground);margin:.1rem 0 1.15rem}
    #radial-dogfood-viz .fields{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1rem}
    #radial-dogfood-viz .field{min-width:0;text-align:center}
    #radial-dogfood-viz .field h3{font-size:13px;min-height:2.2rem;margin-bottom:.35rem}
    #radial-dogfood-viz .field svg{width:100%;height:auto;display:block}
    #radial-dogfood-viz .plots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.5rem;margin-top:1.6rem}
    #radial-dogfood-viz .plot{min-width:0}
    #radial-dogfood-viz .plot>h3{margin-bottom:.45rem}
    #radial-dogfood-viz svg text{fill:var(--foreground);font-size:12px;font-family:inherit}
    #radial-dogfood-viz svg .axis path,#radial-dogfood-viz svg .axis line{stroke:var(--border)}
    #radial-dogfood-viz svg [data-chart-frame]{fill:none;stroke:var(--border)}
    #radial-dogfood-viz .legend{display:flex;flex-wrap:wrap;gap:.35rem 1rem;margin:.55rem 0 .25rem}
    #radial-dogfood-viz .legend button{appearance:none;background:transparent;border:0;color:var(--foreground);font:inherit;padding:.1rem 0;cursor:pointer}
    #radial-dogfood-viz .legend button[aria-pressed="false"]{color:var(--muted-foreground);text-decoration:line-through}
    #radial-dogfood-viz .swatch{display:inline-block;width:.65rem;height:.65rem;margin-right:.35rem}
    #radial-dogfood-viz .tooltip{position:absolute;pointer-events:none;background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);padding:.4rem .55rem;opacity:0;z-index:5}
    @media(max-width:800px){#radial-dogfood-viz .fields{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:620px){#radial-dogfood-viz .plots{grid-template-columns:1fr}}
    @media(max-width:420px){#radial-dogfood-viz .fields{grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem}}
  </style>
