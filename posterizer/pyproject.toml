[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transport-posterizer"
version = "0.1.0"
description = "Saliency-balanced OKLCH raster posterizer"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "Pillow>=10",
  "transport-locked-vectorizer>=0.2.0",
]

[project.scripts]
posterizer = "posterizer.cli:main"
posterizer-gui = "posterizer.web_gui:main"

[tool.setuptools.packages.find]
where = ["src"]
